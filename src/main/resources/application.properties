spring.application.name=rms
application.service.version=${APPLICATION_SERVICE_VERSION:1.0.0}
# Server port externalized
server.port=${SERVER_PORT:8080}
# Datasource configuration externalized (application runtime user)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rms}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# JPA configuration
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Alternatively:
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# OpenAPI/Swagger UI configuration (spec separate from code)
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.urls[0].name=Stations API v1
springdoc.swagger-ui.urls[0].url=/openapi/stations-v1.yaml
springdoc.swagger-ui.urls[1].name=Trains API v1
springdoc.swagger-ui.urls[1].url=/openapi/trains-v1.yaml

# Flyway configuration (migration user)
spring.flyway.enabled=true
spring.flyway.url=${FLYWAY_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rms}}
spring.flyway.user=${FLYWAY_USER}
spring.flyway.password=${FLYWAY_PASSWORD}
# Migration scripts location
spring.flyway.locations=classpath:db/migration
# Allow out-of-order migrations
spring.flyway.out-of-order=true
# Baseline on migrate
spring.flyway.baseline-on-migrate=true
