openapi: 3.0.3
info:
  title: Railway Management System - Station APIs
  version: 1.0.0
  description: Station APIs (spec kept separate from code)
servers:
  - url: /
tags:
  - name: Stations
    description: Station management endpoints
paths:
  /api/v1/stations:
    get:
      operationId: listStations
      tags: [ Stations ]
      summary: List all stations
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StationDTO'
    post:
      operationId: createStation
      tags: [ Stations ]
      summary: Create a station
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationDTO'
      responses:
        '201':
          description: Created
          headers:
            Location:
              description: URI of the created station resource
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/stations/{id}:
    get:
      operationId: getStationById
      tags: [ Stations ]
      summary: Get station by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationDTO'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: updateStation
      tags: [ Stations ]
      summary: Update a station
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StationDTO'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationDTO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteStation
      tags: [ Stations ]
      summary: Delete a station
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/stations/code/{stationCode}:
    get:
      operationId: getStationByCode
      tags: [ Stations ]
      summary: Get station by code
      parameters:
        - name: stationCode
          in: path
          required: true
          schema:
            type: string
            maxLength: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StationDTO'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    NotFound:
      description: Resource not found
    BadRequest:
      description: Validation failed or bad request
    NoContent:
      description: No Content
    Conflict:
      description: Conflict
  schemas:
    StationDTO:
      type: object
      properties:
        stationId:
          type: integer
          format: int32
          readOnly: true
        stationName:
          type: string
          maxLength: 100
        stationCode:
          type: string
          maxLength: 10
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        platformCount:
          type: integer
          format: int32
          minimum: 0
      required:
        - stationName
        - stationCode
        - latitude
        - longitude
        - platformCount

